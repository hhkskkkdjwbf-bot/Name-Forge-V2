name: Validate NameForge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unit, integration, browser and quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: npm install
      - name: Install Python service dependencies
        run: pip install -r python/requirements.txt
      - name: Install Chromium for Playwright and Lighthouse
        run: npx playwright install --with-deps chromium
      - name: Audit phrase banks
        run: npm run audit:python
      - name: Validate linguistic review registry
        run: npm run audit:review
      - name: Audit localization coverage
        run: npm run audit:i18n
      - name: Test Python quality service
        run: PYTHONPATH=python python -m unittest discover -s python/tests -v
      - name: Run application regression tests
        run: npm test
      - name: Type-check application
        run: npm run lint
      - name: Build GitHub Pages site
        run: npm run build:gh-pages
      - name: Run Playwright browser and responsive QA
        run: npm run test:visual
      - name: Run Lighthouse quality audits
        run: npm run audit:lighthouse
      - name: Upload browser and Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nameforge-quality-reports
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
